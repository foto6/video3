name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Focused autonomous reels tests
        run: |
          python -m unittest discover -s tests -p "test_autonomous_reels_r10.py" -v
          python -m unittest discover -s tests -p "test_provider_ingest_r11.py" -v
          python -m unittest discover -s tests -p "test_collection_scheduler_r12.py" -v
          python -m unittest discover -s tests -p "test_experiment_allocator_r13.py" -v
          python -m unittest discover -s tests -p "test_creator_batch_handoff_r14.py" -v
          python -m unittest discover -s tests -p "test_visual_critic_r15.py" -v
          python -m unittest discover -s tests -p "test_gemini_visual_critic_r15b.py" -v
          python -m unittest discover -s tests -p "test_critic_export_r16.py" -v
          python -m unittest discover -s tests -p "test_platform_metrics_runtime_r17.py" -v
          python -m unittest discover -s tests -p "test_candidate_decision_r18.py" -v
          python -m unittest discover -s tests -p "test_post_publish_learning_r19.py" -v
          python -m unittest discover -s tests -p "test_closed_loop_feedback_r20.py" -v
          python -m unittest discover -s tests -p "test_real_artifact_decision_r21.py" -v
          python -m unittest discover -s tests -p "test_web_video_critic_r22.py" -v
          python -m unittest discover -s tests -p "test_critic_reedit_adapter_r23.py" -v\n          python -m unittest discover -s tests -p "test_live_review_ingest_r24.py" -v
      - name: Full unittest suite
        run: python -m unittest discover -s tests -v
      - name: Produce R23 critic re-edit readiness report
        run: |
          python -m growth_analytics.critic_reedit_adapter \
            --report "$RUNNER_TEMP/growth-r23-critic-reedit-report.json" \
            --growth-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID"
      - name: Upload R23 critic re-edit artifact
        uses: actions/upload-artifact@v4
        with:
          name: growth-r23-critic-reedit-adapter
          path: ${{ runner.temp }}/growth-r23-critic-reedit-report.json
          if-no-files-found: error
          retention-days: 90
      - name: Produce R24 live-review ingest readiness evidence
        run: |
          python -m growth_analytics.live_review_ingest \
            --fixture fixtures/live_review_ingest_r24/captured_review_fixture.json \
            --output "$RUNNER_TEMP/growth-r24-fixture-validation.json" \
            --report "$RUNNER_TEMP/growth-r24-live-review-readiness.json" \
            --growth-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID"
          python - "$RUNNER_TEMP/growth-r24-live-review-readiness.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding="utf-8"))
          assert p["fixture_status"] == "FIXTURE_VALIDATED", p
          assert p["real_review_status"] == "NOT_AVAILABLE", p
          assert p["final_live_evidence_gate"] == "BLOCKED_REAL_ATTACHED_VIDEO_REVIEW_CAPTURE_REQUIRED", p
          assert p["invariants"]["human_ground_truth"] is False, p
          assert p["invariants"]["human_parity_inferred"] is False, p
          assert p["provider_mutation"] is False, p
          assert p["upload_performed"] is False, p
          print(json.dumps(p,sort_keys=True))
          PY
      - name: Upload R24 live-review ingest artifact
        uses: actions/upload-artifact@v4
        with:
          name: growth-r24-live-review-ingest
          path: |
            ${{ runner.temp }}/growth-r24-fixture-validation.json
            ${{ runner.temp }}/growth-r24-live-review-readiness.json
          if-no-files-found: error
          retention-days: 90
      - name: Fetch exact Media R16 candidate batch artifact
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r21-media"
          curl --fail --location --retry 3 --retry-delay 2 \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/foto6/video2/actions/artifacts/11163920921/zip" \
            --output "$RUNNER_TEMP/r21-media/media-r16-candidate-batch-demo.zip"
          echo "d929b592c76ec93e41b54701376f4b02366a3bdbd127d3472d73ae277d450d0f  $RUNNER_TEMP/r21-media/media-r16-candidate-batch-demo.zip" | sha256sum --check -
      - name: Produce R21 real-artifact decision pack
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/r21-decision-pack"
          python -m growth_analytics.real_artifact_decision \
            --artifact-zip "$RUNNER_TEMP/r21-media/media-r16-candidate-batch-demo.zip" \
            --output-dir "$RUNNER_TEMP/r21-decision-pack" \
            --growth-sha "$GITHUB_SHA" \
            --growth-run-id "$GITHUB_RUN_ID"
          python - "$RUNNER_TEMP/r21-decision-pack/growth.real_artifact_decision_pack.v1.json" <<'PY'
          import json,os,sys
          p=json.load(open(sys.argv[1],encoding="utf-8"))
          refs={c["candidate_id"]:(c["render_sha256"],c["render_size"],c["render_export_sha256"]) for c in p["candidates"]}
          expected={
            "candidate-1":("3bd12d999264cb932cb3ef15dfbd96e002ede517f2273795b593553b9642d864",575465,"2b5177c00bb054184a239c7eddb1383ad253922e8eb686f5aa2e56c91a1335ac"),
            "candidate-2":("cdae63d5ccce67332e607af7fd87b18c31da8dc77c2f0ce5182550321767286c",576763,"b349b897f8f86bc9257e2622f564d6430f3864ff605ae4b82ba0cb09c59298f6"),
            "candidate-3":("3bd12d999264cb932cb3ef15dfbd96e002ede517f2273795b593553b9642d864",575465,"26fe61f0644e263ce047869334ba65c5973eba809ff45f76286490f573d61b8e"),
          }
          assert refs == expected, (refs, expected)
          assert p["r18_decision"]["decision"] == "insufficient_evidence"
          assert p["r18_decision"]["winner_candidate_id"] is None
          assert p["human_ground_truth"] is False
          assert p["synthetic_metrics_as_live"] is False
          assert p["growth_authority"]["commit_sha"] == os.environ["GITHUB_SHA"]
          assert p["growth_authority"]["run_id"] == os.environ["GITHUB_RUN_ID"]
          print(json.dumps({"candidate_refs":refs,"decision":p["r18_decision"]["decision"],"pack_digest":p["pack_digest"]},sort_keys=True))
          PY
      - name: Upload R21 Human Gate V4 decision artifact
        uses: actions/upload-artifact@v4
        with:
          name: growth-r21-real-artifact-decision
          path: ${{ runner.temp }}/r21-decision-pack
          if-no-files-found: error
          retention-days: 90
