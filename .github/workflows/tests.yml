name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Focused autonomous reels tests
        run: |
          python -m unittest discover -s tests -p "test_autonomous_reels_r10.py" -v
          python -m unittest discover -s tests -p "test_provider_ingest_r11.py" -v
          python -m unittest discover -s tests -p "test_collection_scheduler_r12.py" -v
          python -m unittest discover -s tests -p "test_experiment_allocator_r13.py" -v
          python -m unittest discover -s tests -p "test_creator_batch_handoff_r14.py" -v
          python -m unittest discover -s tests -p "test_visual_critic_r15.py" -v
          python -m unittest discover -s tests -p "test_gemini_visual_critic_r15b.py" -v
          python -m unittest discover -s tests -p "test_critic_export_r16.py" -v
          python -m unittest discover -s tests -p "test_platform_metrics_runtime_r17.py" -v
          python -m unittest discover -s tests -p "test_candidate_decision_r18.py" -v
          python -m unittest discover -s tests -p "test_post_publish_learning_r19.py" -v
          python -m unittest discover -s tests -p "test_closed_loop_feedback_r20.py" -v
          python -m unittest discover -s tests -p "test_real_artifact_decision_r21.py" -v
          python -m unittest discover -s tests -p "test_web_video_critic_r22.py" -v
          python -m unittest discover -s tests -p "test_critic_reedit_adapter_r23.py" -v
          python -m unittest discover -s tests -p "test_live_review_ingest_r24.py" -v
          python -m unittest discover -s tests -p "test_real_capture_r25.py" -v
          python -m unittest discover -s tests -p "test_dynamic_review_capture_r26.py" -v
          python -m unittest discover -s tests -p "test_live_ingest_operator_r27.py" -v
          python -m unittest discover -s tests -p "test_multiround_session_ingest_r28.py" -v
          python -m unittest discover -s tests -p "test_exact_session_ingest_r29.py" -v
      - name: Focused R30 consensus compatibility tests
        run: python -m unittest discover -s tests -p "test_consensus_review_oracle_r30.py" -v
      - name: Focused R31 postpublish learning policy tests
        run: python -m unittest discover -s tests -p "test_postpublish_learning_policy_r31.py" -v
      - name: Focused R32 sequential experiment policy tests
        run: python -m unittest discover -s tests -p "test_sequential_experiment_policy_r32.py" -v
      - name: Focused R33 adaptive portfolio governor tests
        run: python -m unittest discover -s tests -p "test_adaptive_portfolio_governor_r33.py" -v
      - name: Focused R34 counterfactual policy promotion tests
        run: python -m unittest discover -s tests -p "test_counterfactual_policy_promotion_r34.py" -v
      - name: Full unittest suite
        run: python -m unittest discover -s tests -v
      - name: Produce R23 critic re-edit readiness report
        run: |
          python -m growth_analytics.critic_reedit_adapter \
            --report "$RUNNER_TEMP/growth-r23-critic-reedit-report.json" \
            --growth-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID"
      - name: Upload R23 critic re-edit artifact
        uses: actions/upload-artifact@v4
        with:
          name: growth-r23-critic-reedit-adapter
          path: ${{ runner.temp }}/growth-r23-critic-reedit-report.json
          if-no-files-found: error
          retention-days: 90
      - name: Produce R24 live-review ingest readiness evidence
        run: |
          python -m growth_analytics.live_review_ingest \
            --fixture fixtures/live_review_ingest_r24/captured_review_fixture.json \
            --output "$RUNNER_TEMP/growth-r24-fixture-validation.json" \
            --report "$RUNNER_TEMP/growth-r24-live-review-readiness.json" \
            --growth-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID"
          python - "$RUNNER_TEMP/growth-r24-live-review-readiness.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding="utf-8"))
          assert p["fixture_status"] == "FIXTURE_VALIDATED", p
          assert p["real_review_status"] == "NOT_AVAILABLE", p
          assert p["final_live_evidence_gate"] == "BLOCKED_REAL_ATTACHED_VIDEO_REVIEW_CAPTURE_REQUIRED", p
          assert p["invariants"]["human_ground_truth"] is False, p
          assert p["invariants"]["human_parity_inferred"] is False, p
          assert p["provider_mutation"] is False, p
          assert p["upload_performed"] is False, p
          print(json.dumps(p,sort_keys=True))
          PY
      - name: Upload R24 live-review ingest artifact
        uses: actions/upload-artifact@v4
        with:
          name: growth-r24-live-review-ingest
          path: |
            ${{ runner.temp }}/growth-r24-fixture-validation.json
            ${{ runner.temp }}/growth-r24-live-review-readiness.json
          if-no-files-found: error
          retention-days: 90
      - name: Produce R25 R29-capture source-ready evidence
        run: |
          rm -rf "$RUNNER_TEMP/growth-r25-real-capture"
          mkdir -p "$RUNNER_TEMP/growth-r25-real-capture"
          python -m growth_analytics.real_capture_r25 \
            --growth-sha "$GITHUB_SHA" \
            --growth-ci-run-id "$GITHUB_RUN_ID" \
            --observed-r29-branch-head "8b314bd020b05d90f6c45fa861727df5e78e5a39" \
            --out-dir "$RUNNER_TEMP/growth-r25-real-capture" \
            --report "$RUNNER_TEMP/growth-r25-real-capture/readiness.json"
          python - "$RUNNER_TEMP/growth-r25-real-capture/readiness.json" <<'PY'
          import json,os,sys
          p=json.load(open(sys.argv[1],encoding="utf-8"))
          assert p["growth_source_sha"] == os.environ["GITHUB_SHA"], p
          assert str(p["growth_ci_run_id"]) == os.environ["GITHUB_RUN_ID"], p
          assert p["state"] == "SOURCE_READY", p
          assert p["live_capture_gate"] == "BLOCKED_WAITING_R29_CAPTURE", p
          assert p["bridge_r29_expected"]["moving_branch_ref_is_authority"] is False, p
          assert p["invariants"]["human_ground_truth"] is False, p
          assert p["invariants"]["provider_mutation"] is False, p
          assert p["real_capture"] is None, p
          print(json.dumps(p,sort_keys=True))
          PY
      - name: Upload R25 real-capture ingest artifact
        uses: actions/upload-artifact@v4
        with:
          name: growth-r25-real-capture-ingest
          path: ${{ runner.temp }}/growth-r25-real-capture
          if-no-files-found: error
          retention-days: 90
      - name: Fetch exact Media R20 dynamic review artifact
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/r26-media-r20"
          mkdir -p "$RUNNER_TEMP/r26-media-r20"
          curl --fail --location --retry 3 --retry-delay 2 \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/foto6/video2/actions/artifacts/11218642168/zip" \
            --output "$RUNNER_TEMP/r26-media-r20/media-r20-dynamic-review.zip"
          echo "430b64164487d19ec66e76f70edeab640410f88565ed8ae854b8bbc28bd2f410  $RUNNER_TEMP/r26-media-r20/media-r20-dynamic-review.zip" | sha256sum --check -
          unzip -q "$RUNNER_TEMP/r26-media-r20/media-r20-dynamic-review.zip" -d "$RUNNER_TEMP/r26-media-r20/unpacked"
      - name: Produce R26 dynamic-review source-ready evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/growth-r26-dynamic"
          mkdir -p "$RUNNER_TEMP/growth-r26-dynamic"
          ROOT="$RUNNER_TEMP/r26-media-r20/unpacked/initial-review"
          python -m growth_analytics.dynamic_review_capture_r26 \
            --media-package "$ROOT/media.dynamic_review_package.r20.v1.json" \
            --media-evidence "$ROOT/media.dynamic_review_package.r20.evidence.json" \
            --sealed-mapping "$ROOT/media.dynamic_review_sealed_mapping.r20.v1.json" \
            --prompt-manifest "$ROOT/media.direct_model_review_prompt.v1.json" \
            --media-authority conformance/growth.dynamic_live_review_capture.r26.v1/media-r20-initial-authority.json \
            --growth-sha "$GITHUB_SHA" \
            --growth-ci-run-id "$GITHUB_RUN_ID" \
            --observed-bridge-sha "ceaee873231a8552c5b7324083baa800eec566a8" \
            --out-dir "$RUNNER_TEMP/growth-r26-dynamic" \
            --report "$RUNNER_TEMP/growth-r26-dynamic/readiness.json"
          python - "$RUNNER_TEMP/growth-r26-dynamic/readiness.json" <<'PY'
          import json,os,sys
          p=json.load(open(sys.argv[1],encoding="utf-8"))
          assert p["growth_source_sha"] == os.environ["GITHUB_SHA"], p
          assert str(p["growth_ci_run_id"]) == os.environ["GITHUB_RUN_ID"], p
          assert p["state"] == "SOURCE_READY", p
          assert p["live_capture_gate"] == "BLOCKED_WAITING_DYNAMIC_CAPTURE", p
          assert p["media_source_ready"] is True, p
          assert p["media"]["authority"]["producer_sha"] == "b22174db3c772a49a21fb9f8b1d40828bf258005", p
          assert p["media"]["package_digest"] == "afa44228dd19a668e6ebb40d5985c2b1a18ae973bf377d1ca6b71ace803f8826", p
          assert p["media"]["sealed_mapping_digest"] == "ba4bb4498ce848a4622a44decbc5df08918155d286e49fa6e36693b5f71c0ca6", p
          assert p["bridge_expected"]["r29_exact_green_sha"] == "ed9a35290f94607d7577f1ee9301de1bb44334f2", p
          assert p["bridge_expected"]["r30_exact_green_sha"] == "ceaee873231a8552c5b7324083baa800eec566a8", p
          assert p["bridge_expected"]["current_r29_dynamic_capture_available"] is False, p
          assert p["bridge_expected"]["current_r30_dynamic_capture_available"] is False, p
          assert p["invariants"]["model_facing_labels_are_candidate_identity"] is False, p
          assert p["invariants"]["human_ground_truth"] is False, p
          assert p["invariants"]["human_rating_evidence"] is False, p
          assert p["invariants"]["provider_mutation"] is False, p
          assert p["live_capture"] is None, p
          print(json.dumps(p,sort_keys=True))
          PY
      - name: Upload R26 dynamic-review capture artifact
        uses: actions/upload-artifact@v4
        with:
          name: growth-r26-dynamic-review-capture
          path: ${{ runner.temp }}/growth-r26-dynamic
          if-no-files-found: error
          retention-days: 90
      - name: Fetch exact Media R21 round-pair artifact
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/r27-media-r21"
          mkdir -p "$RUNNER_TEMP/r27-media-r21"
          curl --fail --location --retry 3 --retry-delay 2 \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/foto6/video2/actions/artifacts/11221240371/zip" \
            --output "$RUNNER_TEMP/r27-media-r21/media-r21-round-pair-review.zip"
          echo "1036800923196882590ace62edbaa123ab4250b9d242e14adba909ba256ab022  $RUNNER_TEMP/r27-media-r21/media-r21-round-pair-review.zip" | sha256sum --check -
          unzip -q "$RUNNER_TEMP/r27-media-r21/media-r21-round-pair-review.zip" -d "$RUNNER_TEMP/r27-media-r21/unpacked"
      - name: Produce R27 exact-authority source-ready indexes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/growth-r27-live-ingest"
          mkdir -p "$RUNNER_TEMP/growth-r27-live-ingest/initial" "$RUNNER_TEMP/growth-r27-live-ingest/round-1"
          PROFILE="conformance/growth.live_ingest_operator.r27.v1/authority-profiles.json"
          for BUNDLE in initial round-1; do
            python -m growth_analytics.live_ingest_operator_r27 \
              --package-dir "$RUNNER_TEMP/r27-media-r21/unpacked/$BUNDLE" \
              --authority-profile "$PROFILE" \
              --ledger-dir "$RUNNER_TEMP/growth-r27-live-ingest/ledger-$BUNDLE" \
              --out-dir "$RUNNER_TEMP/growth-r27-live-ingest/$BUNDLE" \
              --growth-sha "$GITHUB_SHA" \
              --growth-ci-run-id "$GITHUB_RUN_ID" \
              --report "$RUNNER_TEMP/growth-r27-live-ingest/$BUNDLE/readiness.json"
          done
          python - "$RUNNER_TEMP/growth-r27-live-ingest" <<'PY'
          import json,os,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          expected={
            "initial":(
              "b2de4082a2f466a945319f284f898675f1d9ee3d8565f4ae4305a556cfa00940",
              "a7d03a3eb6bc44c021069c4b3603ebb09c3a120161d97124bc2da0516ea7837b",
              0,
            ),
            "round-1":(
              "521bf3c0474845895a76f4cbd26abf876d978ca2e39fe3c127d6918043438546",
              "9edb9f556c07564af3d335e7bba54c8b26347b0e08289bc6f8d0262930388be7",
              1,
            ),
          }
          digests={}
          for name,(package,mapping,round_no) in expected.items():
            report=json.load(open(root/name/"readiness.json",encoding="utf-8"))
            index=json.load(open(root/name/"growth.dynamic_live_review_ingest_index.r27.v1.json",encoding="utf-8"))
            assert report["state"] == "SOURCE_READY", report
            assert report["live_review_ingested"] is False, report
            assert report["provider_mutation"] is False, report
            assert report["human_ground_truth"] is False, report
            assert index["state"] == "SOURCE_READY", index
            assert index["live_capture_gate"] == "BLOCKED_WAITING_GENUINE_CAPTURE", index
            assert index["growth_r27"]["producer_sha"] == os.environ["GITHUB_SHA"], index
            assert str(index["growth_r27"]["ci_run_id"]) == os.environ["GITHUB_RUN_ID"], index
            assert index["media_r21"]["package_digest"] == package, index
            assert index["media_r21"]["sealed_mapping_digest"] == mapping, index
            assert index["media_r21"]["review_round"] == round_no, index
            assert index["bridge_r30"]["producer_sha"] == "ceaee873231a8552c5b7324083baa800eec566a8", index
            assert index["capture"] is None and index["pairwise"] is None, index
            assert index["evidence_boundary"]["human_ground_truth"] is False, index
            assert index["evidence_boundary"]["fixture_promoted"] is False, index
            assert index["evidence_boundary"]["provider_mutation"] is False, index
            digests[name]={"index_digest":index["index_digest"],"authority_profile_digest":index["growth_r27"]["authority_profile_digest"]}
          assert digests["initial"]["authority_profile_digest"] == digests["round-1"]["authority_profile_digest"], digests
          print(json.dumps(digests,sort_keys=True))
          PY
      - name: Prove R27 exact package and mapping drift fail closed
        shell: bash
        run: |
          set -euo pipefail
          PROFILE="conformance/growth.live_ingest_operator.r27.v1/authority-profiles.json"
          cp -R "$RUNNER_TEMP/r27-media-r21/unpacked/round-1" "$RUNNER_TEMP/r27-media-r21/stale-round-1"
          printf '\n' >> "$RUNNER_TEMP/r27-media-r21/stale-round-1/media.review_round_sealed_mapping.r21.v1.json"
          set +e
          python -m growth_analytics.live_ingest_operator_r27 \
            --package-dir "$RUNNER_TEMP/r27-media-r21/stale-round-1" \
            --authority-profile "$PROFILE" \
            --ledger-dir "$RUNNER_TEMP/growth-r27-live-ingest/stale-ledger" \
            --out-dir "$RUNNER_TEMP/growth-r27-live-ingest/stale" \
            --growth-sha "$GITHUB_SHA" \
            --growth-ci-run-id "$GITHUB_RUN_ID" \
            --report "$RUNNER_TEMP/growth-r27-live-ingest/stale-readiness.json"
          STATUS=$?
          set -e
          test "$STATUS" -ne 0
          python - "$RUNNER_TEMP/growth-r27-live-ingest/stale-readiness.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding="utf-8"))
          assert p["state"] == "BLOCKED_WAITING_GENUINE_CAPTURE", p
          assert p["live_review_ingested"] is False, p
          assert p["provider_mutation"] is False, p
          PY
      - name: Upload R27 live-ingest operator artifact
        uses: actions/upload-artifact@v4
        with:
          name: growth-r27-live-ingest-operator
          path: ${{ runner.temp }}/growth-r27-live-ingest
          if-no-files-found: error
          retention-days: 90
      - name: Fetch exact Media R22 live-review operator artifact
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/r28-media-r22"
          mkdir -p "$RUNNER_TEMP/r28-media-r22"
          curl --fail --location --retry 3 --retry-delay 2 \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/foto6/video2/actions/artifacts/11224061610/zip" \
            --output "$RUNNER_TEMP/r28-media-r22/media-r22-live-review-operator-bundle.zip"
          echo "d534f1656e22b72cf42531c827e66516965b4167549906521dee04edafd01734  $RUNNER_TEMP/r28-media-r22/media-r22-live-review-operator-bundle.zip" | sha256sum --check -
          unzip -q "$RUNNER_TEMP/r28-media-r22/media-r22-live-review-operator-bundle.zip" -d "$RUNNER_TEMP/r28-media-r22/unpacked"
      - name: Produce R28 multiround source-ready and fixture rehearsal evidence
        shell: bash
        run: |
          set -euo pipefail
          PROFILE="conformance/growth.multiround_session_ingest.r28.v1/authority-profiles.json"
          OUT="$RUNNER_TEMP/growth-r28-session-ingest"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          python -m growth_analytics.multiround_session_ingest_r28 source-ready \
            --operator-dir "$RUNNER_TEMP/r28-media-r22/unpacked/initial" \
            --authority-profile "$PROFILE" \
            --session-dir "$OUT/session-initial" \
            --out-dir "$OUT/source-ready-initial" \
            --conversation-id "ci-r28-dedicated-review-conversation" \
            --growth-sha "$GITHUB_SHA" \
            --growth-ci-run-id "$GITHUB_RUN_ID"
          python -m growth_analytics.multiround_session_ingest_r28 source-ready \
            --operator-dir "$RUNNER_TEMP/r28-media-r22/unpacked/round-1" \
            --authority-profile "$PROFILE" \
            --session-dir "$OUT/session-round1-isolated" \
            --out-dir "$OUT/source-ready-round1" \
            --conversation-id "ci-r28-dedicated-review-conversation-round1" \
            --growth-sha "$GITHUB_SHA" \
            --growth-ci-run-id "$GITHUB_RUN_ID"
          python -m growth_analytics.multiround_session_ingest_r28 rehearse-fixtures \
            --fixture fixtures/session_ingest_r28/multiround-rehearsal.json \
            --authority-profile "$PROFILE" \
            --out-dir "$OUT/fixture-rehearsal" \
            --growth-sha "$GITHUB_SHA" \
            --growth-ci-run-id "$GITHUB_RUN_ID"
          python - "$OUT" <<'PY'
          import json,os,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          initial=json.load(open(root/"source-ready-initial"/"session-readiness.json",encoding="utf-8"))
          round1=json.load(open(root/"source-ready-round1"/"session-readiness.json",encoding="utf-8"))
          rehearsal=json.load(open(root/"fixture-rehearsal"/"fixture-multiround-rehearsal.json",encoding="utf-8"))
          assert initial["state"] == "SOURCE_READY", initial
          assert initial["live_capture_gate"] == "BLOCKED_WAITING_GENUINE_CAPTURE", initial
          assert initial["package_review_round"] == 0, initial
          assert initial["package_digest"] == "b2de4082a2f466a945319f284f898675f1d9ee3d8565f4ae4305a556cfa00940", initial
          assert initial["sealed_mapping_digest"] == "a7d03a3eb6bc44c021069c4b3603ebb09c3a120161d97124bc2da0516ea7837b", initial
          assert initial["operator_manifest_sha256"] == "cd2d106291001e4b650d6c67f3dae0c50ed7b8a9c30b463e1c91e503f32fffae", initial
          assert initial["archive_sha256"] == "5a6f9749599fc60c39da0b7df3035c90ca12f0a89776735752692a7c9275b052", initial
          assert initial["live_review_ingested"] is False, initial
          assert initial["creator_executable_handoff_emitted"] is False, initial
          assert initial["human_ground_truth"] is False, initial
          assert initial["human_rating_evidence"] is False, initial
          assert initial["human_parity_inferred"] is False, initial
          assert initial["browser_mutation"] is False and initial["provider_mutation"] is False, initial
          assert initial["growth_r28"]["producer_sha"] == os.environ["GITHUB_SHA"], initial
          assert str(initial["growth_r28"]["ci_run_id"]) == os.environ["GITHUB_RUN_ID"], initial
          assert initial["package_sequence_ready"] is True, initial

          assert round1["state"] == "SOURCE_READY", round1
          assert round1["package_review_round"] == 1, round1
          assert round1["package_sequence_ready"] is False, round1
          assert round1["package_digest"] == "521bf3c0474845895a76f4cbd26abf876d978ca2e39fe3c127d6918043438546", round1
          assert round1["sealed_mapping_digest"] == "9edb9f556c07564af3d335e7bba54c8b26347b0e08289bc6f8d0262930388be7", round1
          assert round1["operator_manifest_sha256"] == "0c8583287adfc38a21579a9fb9eb7b86111c36e08390796932203b1c7ab87d13", round1
          assert round1["archive_sha256"] == "aa2ac8c6c3cd51be32bfccf7f77091f078320fd4c5fb213a7dbf3de9f2fcae99", round1
          assert round1["live_review_ingested"] is False, round1
          assert round1["creator_executable_handoff_emitted"] is False, round1
          assert round1["human_ground_truth"] is False, round1
          assert round1["provider_mutation"] is False, round1

          assert rehearsal["state"] == "SOURCE_READY", rehearsal
          assert rehearsal["fixture_only"] is True, rehearsal
          assert rehearsal["round_sequence_proven"] == [0,1,2], rehearsal
          assert rehearsal["fourth_review_rejected"] is True, rehearsal
          assert rehearsal["live_review_ingested"] is False, rehearsal
          assert rehearsal["creator_executable_handoff_emitted"] is False, rehearsal
          assert rehearsal["fixture_promoted"] is False, rehearsal
          assert rehearsal["human_ground_truth"] is False, rehearsal
          assert rehearsal["provider_mutation"] is False, rehearsal
          print(json.dumps({"initial":initial,"rehearsal":rehearsal},sort_keys=True))
          PY
      - name: Prove R28 Media R22 package drift fails closed
        shell: bash
        run: |
          set -euo pipefail
          PROFILE="conformance/growth.multiround_session_ingest.r28.v1/authority-profiles.json"
          OUT="$RUNNER_TEMP/growth-r28-session-ingest"
