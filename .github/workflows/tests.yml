name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Focused durable decision delivery tests
        run: python -m unittest discover -s tests -p "test_decision_delivery_milestone.py" -v
      - name: Full unittest suite
        run: python -m unittest discover -s tests -v
